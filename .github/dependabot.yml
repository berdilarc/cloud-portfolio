version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: terraform
    directories:
      - /gcp/**/*
    schedule:
      interval: weekly
    groups:
      terraform-providers:
        patterns: ["*"]
    commit-message:
      prefix: chore
