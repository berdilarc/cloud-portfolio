name: terraform

on:
  workflow_call:
    inputs:
      stage:
        type: string
        description: Stage name, as used in the bucket paths and as the environment name.
        required: true
      working_directory:
        type: string
        description: Directory of the stage, relative to the repository root.
        required: true
      service_account_prefix:
        type: string
        description: Prefix of the stage's CI/CD account names, such as iac-org.
        required: true
      tfvars_files:
        type: string
        description: Space-separated names of the earlier stages' tfvars files to download, such as 0-org-setup.
        required: false
        default: ""
    secrets:
      domain:
        description: Domain of the organization and its groups, masked in logs and redacted in the plan summary.
        required: true

permissions:
  contents: read

env:
  IAC_PROJECT: ${{ vars.GCP_PREFIX }}-prod-iac-core-0
  IAC_PROJECT_NUMBER: ${{ vars.GCP_IAC_PROJECT_NUMBER }}
  STAGE: ${{ inputs.stage }}
  TFVARS_FILES: ${{ inputs.tfvars_files }}
  TF_VAR_billing_account: ${{ vars.GCP_BILLING_ACCOUNT }}
  TF_VAR_domain: ${{ secrets.domain }}
  TF_VAR_github_repository: ${{ github.repository }}
  TF_VAR_github_repository_id: ${{ github.repository_id }}
  TF_VAR_github_repository_owner_id: ${{ github.repository_owner_id }}
  TF_VAR_org_id: ${{ vars.GCP_ORG_ID }}
  TF_VAR_prefix: ${{ vars.GCP_PREFIX }}

jobs:
  plan:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # Workload Identity Federation login to Google Cloud
      pull-requests: write # plan summary comment
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working_directory }}
    env:
      SERVICE_ACCOUNT: ${{ inputs.service_account_prefix }}-cicd-${{ github.event_name == 'push' && 'merge' || 'pr' }}@${{ vars.GCP_PREFIX }}-prod-iac-core-0.iam.gserviceaccount.com
    outputs:
      applyable: ${{ steps.summary.outputs.applyable }}
      plan_attempt: ${{ steps.upload.outputs.attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check configuration
        run: |
          for name in IAC_PROJECT_NUMBER TF_VAR_billing_account TF_VAR_domain TF_VAR_org_id TF_VAR_prefix; do
            if [[ -z "${!name}" ]]; then
              echo "::error::${name} is empty. Set the repository variables and the GCP_DOMAIN secret."
              exit 1
            fi
          done

      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.11.9
          install_args: terraform

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/${{ vars.GCP_IAC_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Download output files
        run: |
          gcloud storage cp "gs://${IAC_PROJECT}-outputs/providers/${STAGE}-ro-providers.tf" .
          for file in $TFVARS_FILES; do
            gcloud storage cp "gs://${IAC_PROJECT}-outputs/tfvars/${file}.auto.tfvars.json" .
          done

      - name: Terraform init
        run: terraform init -input=false -lockfile=readonly -no-color

      - name: Terraform plan
        run: terraform plan -input=false -lock=false -no-color -out tfplan

      - name: Summarize plan
        id: summary
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          terraform show -json tfplan > "$RUNNER_TEMP/tfplan.json"
          applyable=$(jq '.applyable' "$RUNNER_TEMP/tfplan.json")
          echo "applyable=${applyable}" >> "$GITHUB_OUTPUT"
          {
            echo "### Terraform plan: ${STAGE} at ${COMMIT_SHA::7}"
            echo
            jq -r --arg domain "$TF_VAR_domain" '
              def redact: split($domain) | join("***");
              def count($action): [.resource_changes[]? | select(any(.change.actions[]; . == $action))] | length;
              def pad($width): . + " " * ($width - length);
              def line($address):
                {
                  "create": ["+", "create"],
                  "update": ["!", "update"],
                  "delete": ["-", "delete"],
                  "delete,create": ["-/+", "replace"],
                  "create,delete": ["+/-", "replace"]
                }[join(",")] // ["", join(", ")]
                | "\(.[0] | pad(3)) \(.[1] | pad(8)) \($address | redact)";
              ([.resource_changes[]? | select(.change.actions != ["no-op"])
                | .address as $address | .change.actions | line($address)]
              + [(.output_changes // {}) | to_entries[] | select(.value.actions != ["no-op"])
                | "output.\(.key)" as $address | .value.actions | line($address)]) as $lines
              | if $lines == [] then "No changes."
                else "Plan: \(count("create")) to add, \(count("update")) to change, \(count("delete")) to destroy.\n\n```diff\n\($lines | join("\n"))\n```"
                end' "$RUNNER_TEMP/tfplan.json"
          } > plan-summary.md
          cat plan-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file plan-summary.md

      # gcloud storage cp reads the destination object first, which Object Creator doesn't allow.
      - name: Upload merge plan
        id: upload
        if: github.event_name == 'push' && steps.summary.outputs.applyable == 'true'
        run: |
          token=$(gcloud auth print-access-token)
          echo "::add-mask::${token}"
          curl --silent --show-error --fail-with-body \
            --request POST \
            --header "Authorization: Bearer ${token}" \
            --header "Content-Type: application/octet-stream" \
            --data-binary @tfplan \
            "https://storage.googleapis.com/upload/storage/v1/b/${IAC_PROJECT}-cicd-plans/o?uploadType=media&ifGenerationMatch=0&name=${STAGE}%2F${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}.tfplan"
          echo "attempt=${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

  apply:
    needs: plan
    if: github.event_name == 'push' && needs.plan.outputs.applyable == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: ${{ inputs.stage }}
    permissions:
      contents: read
      id-token: write # Workload Identity Federation login to Google Cloud
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working_directory }}
    env:
      SERVICE_ACCOUNT: ${{ inputs.service_account_prefix }}-cicd-apply@${{ vars.GCP_PREFIX }}-prod-iac-core-0.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check configuration
        run: |
          for name in IAC_PROJECT_NUMBER TF_VAR_billing_account TF_VAR_domain TF_VAR_org_id TF_VAR_prefix; do
            if [[ -z "${!name}" ]]; then
              echo "::error::${name} is empty. Set the repository variables and the GCP_DOMAIN secret."
              exit 1
            fi
          done

      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.11.9
          install_args: terraform

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/${{ vars.GCP_IAC_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Download output files and merge plan
        env:
          PLAN_ATTEMPT: ${{ needs.plan.outputs.plan_attempt }}
        run: |
          gcloud storage cp "gs://${IAC_PROJECT}-outputs/providers/${STAGE}-providers.tf" .
          for file in $TFVARS_FILES; do
            gcloud storage cp "gs://${IAC_PROJECT}-outputs/tfvars/${file}.auto.tfvars.json" .
          done
          gcloud storage cp "gs://${IAC_PROJECT}-cicd-plans/${STAGE}/${GITHUB_SHA}-${PLAN_ATTEMPT}.tfplan" merge.tfplan

      - name: Terraform init
        run: terraform init -input=false -lockfile=readonly -no-color

      - name: Terraform plan
        run: terraform plan -input=false -no-color -out tfplan

      - name: Compare with merge plan
        run: |
          changes='{
            resource_changes: ([.resource_changes[]? | select(.change.actions != ["no-op"])] | sort_by(.address)),
            output_changes: ((.output_changes // {}) | with_entries(select(.value.actions != ["no-op"])))
          }'
          terraform show -json merge.tfplan | jq -S "$changes" > "$RUNNER_TEMP/merge-changes.json"
          terraform show -json tfplan | jq -S "$changes" > "$RUNNER_TEMP/changes.json"
          if ! cmp -s "$RUNNER_TEMP/merge-changes.json" "$RUNNER_TEMP/changes.json"; then
            echo "::error::The plan differs from the approved merge plan. Re-run all jobs to create a new merge plan."
            exit 1
          fi

      - name: Terraform apply
        run: terraform apply -input=false -no-color tfplan
